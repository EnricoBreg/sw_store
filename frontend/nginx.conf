# Build localizzata: una cartella per lingua (/it/, /en/), ciascuna con il proprio index.html.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # La radice porta alla lingua di default
  location = / {
    return 302 /it/;
  }

  # /it e /en senza slash finale
  location = /it {
    return 302 /it/;
  }

  location = /en {
    return 302 /en/;
  }

  # Fallback SPA: le rotte di Angular vengono servite dall'index.html della lingua
  location /it/ {
    try_files $uri $uri/ /it/index.html;
  }

  location /en/ {
    try_files $uri $uri/ /en/index.html;
  }

  # Percorsi senza lingua (es. link vecchi): stessa pagina in italiano
  location / {
    return 302 /it$request_uri;
  }

  # I file con hash nel nome non cambiano mai: cache lunga; index.html sempre aggiornato
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* /index\.html$ {
    add_header Cache-Control "no-cache";
  }
}
